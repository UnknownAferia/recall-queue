x-vora-service: &vora-service
  image: vora:${VORA_IMAGE_TAG:-latest}
  build:
    context: .
    target: runtime
  env_file:
    - ${VORA_ENV_FILE:-.env}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  vora-core:
    <<: *vora-service
    command: npm run start
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs", "core"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    volumes:
      - vora-core-logs:/app/logs

  vora-community:
    <<: *vora-service
    command: npm run start:community
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs", "community"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    volumes:
      - vora-community-logs:/app/logs
      - vora-public-data:/app/public-data
      - vora-website-analytics:/app/website-analytics:ro
    environment:
      VORA_PUBLIC_DATA_DIRECTORY: /app/public-data
      VORA_WEBSITE_ANALYTICS_FILE: /app/website-analytics/website-conversions.json

  vora-website:
    image: vora-website:${VORA_IMAGE_TAG:-latest}
    build:
      context: ./website
      target: runtime
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - vora-public-data:/app/public-data:ro
      - vora-website-analytics:/app/website-analytics
    environment:
      VORA_WEBSITE_ANALYTICS_FILE: /app/website-analytics/website-conversions.json
      VORA_CONTROL_DISCORD_CLIENT_ID: "${VORA_COMMUNITY_DISCORD_CLIENT_ID:?Set VORA_COMMUNITY_DISCORD_CLIENT_ID}"
      VORA_CONTROL_DISCORD_CLIENT_SECRET: "${VORA_CONTROL_DISCORD_CLIENT_SECRET:?Set VORA_CONTROL_DISCORD_CLIENT_SECRET}"
      VORA_CONTROL_DISCORD_GUILD_ID: "${VORA_CONTROL_DISCORD_GUILD_ID:?Set VORA_CONTROL_DISCORD_GUILD_ID}"
      VORA_CONTROL_ALLOWED_ROLE_IDS: "${VORA_CONTROL_ALLOWED_ROLE_IDS:-}"
      VORA_CONTROL_DISCORD_REDIRECT_URI: "${VORA_CONTROL_DISCORD_REDIRECT_URI:-https://voramlbb.com/control/auth/callback}"
      VORA_CONTROL_SESSION_SECRET: "${VORA_CONTROL_SESSION_SECRET:?Set VORA_CONTROL_SESSION_SECRET}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  vora-web:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/web/Caddyfile:/etc/caddy/Caddyfile:ro
      - vora-caddy-data:/data
      - vora-caddy-config:/config
    environment:
      VORA_CONTROL_USERNAME: "${VORA_CONTROL_USERNAME:?Set VORA_CONTROL_USERNAME}"
      VORA_CONTROL_PASSWORD_HASH: "${VORA_CONTROL_PASSWORD_HASH:?Set VORA_CONTROL_PASSWORD_HASH}"
    depends_on:
      vora-website:
        condition: service_healthy
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  vora-backup:
    <<: *vora-service
    profiles: [maintenance]
    command: npm run backup
    restart: "no"
    environment:
      VORA_BACKUP_DIRECTORY: /app/backups
    volumes:
      - ${VORA_BACKUP_DIRECTORY:-./backups}:/app/backups

  vora-backup-verify:
    <<: *vora-service
    profiles: [maintenance]
    command: npm run backup:verify
    restart: "no"
    environment:
      VORA_BACKUP_DIRECTORY: /app/backups
    volumes:
      - ${VORA_BACKUP_DIRECTORY:-./backups}:/app/backups:ro

  vora-backup-prune:
    <<: *vora-service
    profiles: [maintenance]
    command: npm run backup:prune
    restart: "no"
    environment:
      VORA_BACKUP_DIRECTORY: /app/backups
    volumes:
      - ${VORA_BACKUP_DIRECTORY:-./backups}:/app/backups

volumes:
  vora-core-logs:
  vora-community-logs:
  vora-caddy-data:
  vora-caddy-config:
  vora-public-data:
  vora-website-analytics:
